# Copy to vexa/.github/workflows/trigger-deploy.yml
name: Trigger Deploy

on:
  push:
    branches: [develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run tests
        run: |
          cd services/bot-manager
          pip install -r requirements.txt -r requirements-test.txt
          python -m pytest tests/ -v --ignore=tests/e2e

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and wait for deploy
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SERVICE=vexa
          PLATFORM=x-squadron/faktions-platform

          gh workflow run deploy.yml -R "$PLATFORM" -f service="$SERVICE"
          echo "Triggered deploy for $SERVICE"

          sleep 10

          RUN_ID=$(gh run list -R "$PLATFORM" -w deploy.yml \
            --event workflow_dispatch -L 1 \
            --json databaseId --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find deploy run"
            exit 1
          fi

          echo "Deploy run: https://github.com/$PLATFORM/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" -R "$PLATFORM" --exit-status
