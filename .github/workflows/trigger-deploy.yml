# Copy to vexa/.github/workflows/trigger-deploy.yml
name: Trigger Deploy

on:
  push:
    branches: [develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run tests
        run: |
          cd services/bot-manager
          pip install -r requirements.txt -r requirements-test.txt
          python -m pytest tests/ -v --ignore=tests/e2e

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: x-squadron/faktions-platform/.github/actions/trigger-deploy@main
        with:
          service-name: vexa
          environment: develop
          github-token: ${{ secrets.GH_PAT }}
